name: Environment contracts and packaging
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/client/pyproject.toml
      - run: python -m pip install -e ./packages/client -e '.[test]'
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-python-${{ matrix.python }}
          path: test-results.xml
  scenic-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ./packages/client -e '.[carla,test]'
      - run: python -m pip check
      - run: python -m pytest tests/test_legacy_characterization.py tests/test_scenic_rebuild.py -q
  installed-wheels:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_wheel_install.py --output wheel-install-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-install-report
          path: wheel-install-report.json
